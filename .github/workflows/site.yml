name: Publicar o site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez. Nao cancela a que ja esta correndo: interromper um
# deploy no meio deixaria o site num estado que ninguem pediu.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Uma release roda no ref da TAG, e o ambiente github-pages so aceita deploy do
  # branch padrao - a execucao morre em "not allowed to deploy due to environment
  # protection rules". Em vez de afrouxar a protecao, a release apenas PEDE uma
  # execucao em main, que publica normalmente. O site tambem sai sempre do codigo
  # de main, e nao da arvore congelada da tag.
  pedir-publicacao:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main

  publicar:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Retrato das versoes, servido junto com o site.
      #
      # A API do GitHub sem autenticacao permite 60 chamadas por hora POR IP.
      # Um IP compartilhado - empresa, faculdade, operadora movel - estoura isso
      # sem o visitante ter culpa nenhuma, e o botao de baixar sumiria para ele.
      # Com o retrato, o site continua inteiro mesmo com a cota zerada.
      - name: Gravar o retrato das versoes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            > site/assets/releases.json
          echo "Versoes no retrato: $(jq 'length' site/assets/releases.json)"

      # Carimba a versao do site na URL do modulo.
      #
      # index.html e versoes.js sao arquivos separados, cada um com seu proprio
      # cache de 10 minutos no Pages. Sem o carimbo, um deploy que mexa nos dois
      # pode entregar a um visitante o HTML novo com o modulo velho - e o import
      # falha com "does not provide an export named ...", derrubando a lista de
      # versoes inteira. Aconteceu de verdade na primeira publicacao.
      - name: Carimbar a versao do site
        run: |
          set -euo pipefail
          CARIMBO="${GITHUB_SHA:0:12}"
          sed -i "s/__VERSAO_DO_SITE__/${CARIMBO}/g" site/index.html
          if grep -q "__VERSAO_DO_SITE__" site/index.html; then
            echo "O marcador de versao sobrou no HTML." >&2
            exit 1
          fi
          echo "Modulo versionado com ${CARIMBO}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
